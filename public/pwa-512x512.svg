<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="daisoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea2820"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Base -->
  <rect width="512" height="512" rx="115" fill="url(#daisoGrad)"/>

  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Central Clipboard / Report Icon -->
  <g filter="url(#dropShadow)" transform="translate(106, 90)">
    <!-- Clipboard Board -->
    <rect x="20" y="40" width="260" height="310" rx="24" fill="#ffffff"/>
    
    <!-- Top Clip -->
    <rect x="90" y="20" width="120" height="36" rx="12" fill="#0f172a"/>
    <circle cx="150" cy="38" r="7" fill="#ffffff"/>

    <!-- Document Report Lines -->
    <rect x="55" y="100" width="190" height="14" rx="7" fill="#ea2820"/>
    <rect x="55" y="135" width="140" height="10" rx="5" fill="#94a3b8"/>
    <rect x="55" y="160" width="190" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="55" y="185" width="170" height="10" rx="5" fill="#cbd5e1"/>

    <!-- Checkmark Badge -->
    <circle cx="150" cy="270" r="42" fill="#ea2820"/>
    <path d="M136 270 L146 280 L166 258" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- DAISO Text Banner -->
  <text x="256" y="465" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="4">
    DAISO DLR
  </text>
</svg>
