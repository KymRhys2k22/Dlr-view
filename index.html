<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Primary Colors & Meta Tags -->
    <meta name="theme-color" content="#ea2820" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Daiso Store Operations Damage & Lost Report (DLR) Web Dashboard and Inventory Loss Management Portal" />
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daiso DLR" />
    
    <!-- Windows PWA Support -->
    <meta name="msapplication-TileColor" content="#ea2820" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <title>Daiso Damage &amp; Lost Report (DLR)</title>
    <script>
      // Safely unregister legacy Service Workers before clearing caches so active requests are never interrupted
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (regs && regs.length > 0) {
                Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister();
                  })
                )
                  .then(function () {
                    if ('caches' in window) {
                      return caches.keys().then(function (keys) {
                        return Promise.all(
                          keys.map(function (key) {
                            return caches.delete(key);
                          })
                        );
                      });
                    }
                  })
                  .then(function () {
                    if (!sessionStorage.getItem('dlr_sw_cleaned_v2')) {
                      sessionStorage.setItem('dlr_sw_cleaned_v2', '1');
                      window.location.reload();
                    }
                  });
              }
            });
          }
        } catch (err) {
          // ignore
        }
      })();
    </script>
  </head>
  <body class="bg-[#F5F5F7] text-[#1D1D1F] antialiased min-h-screen selection:bg-rose-600 selection:text-white [text-rendering:optimizeLegibility] [font-feature-settings:'cv02','cv03','cv04','cv11']">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
